name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rolling_razors_test
          POSTGRES_USER: rolling_razors
          POSTGRES_PASSWORD: rolling_razors_pass
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rolling_razors:rolling_razors_pass@localhost:5435/rolling_razors_test
      DATABASE_ENGINE: postgres
      ADMIN_EMAIL: owner@rollingrazors.test
      ADMIN_PHONE: "+254 700 000 001"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate disposable test credentials
        shell: bash
        run: |
          test_admin_password="$(openssl rand -base64 32 | tr -d '\n')"
          {
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_PASSWORD=$test_admin_password"
            echo "SEED_ADMIN_PASSWORD=$test_admin_password"
            echo "MPESA_CALLBACK_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list
      - run: npx prisma generate --check 2>&1 | head -20
